services:
  web:
    build: .
    image: mt-benchmark-web:local
    init: true
    ports:
      - "${HOST_BIND:-0.0.0.0}:${PORT:-8080}:8080"
    environment:
      TORCH_THREADS: ${TORCH_THREADS:-2}
      OMP_NUM_THREADS: ${TORCH_THREADS:-2}
      MKL_NUM_THREADS: ${TORCH_THREADS:-2}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
